description: >-
  Brandwatch is a leading consumer intelligence and social media analytics platform
  providing access to trillions of consumer conversations. The platform offers six
  distinct APIs for analysis, data upload, consumer research, social metrics,
  publishing, and engagement. Businesses use Brandwatch to track brand mentions,
  monitor competitors, analyze sentiment, and integrate social data with existing
  analytics and CRM systems for strategic decision-making.
apis:
  - aid: brandwatch:analysis-api
    name: Brandwatch Analysis API
    tags:
      - Analytics
      - Social Media
      - Sentiment Analysis
      - Aggregated Statistics
    humanURL: https://developers.brandwatch.com/docs/getting-started-analysis-api
    baseURL: https://api.brandwatch.com
    properties:
      - url: https://developers.brandwatch.com/docs/getting-started-analysis-api
        type: Documentation
      - url: https://developers.brandwatch.com/docs/getting-started-analysis-api
        type: GettingStarted
      - url: https://developers.brandwatch.com/docs/analysis-request
        type: APIReference
    description: >-
      Query Brandwatch's content library or imported data to return aggregated
      statistics and computed analysis. Enables programmatic access to brand
      mention analytics, sentiment scores, volume trends, and consumer insights
      across social media platforms, news sites, and forums. Asynchronous:
      POST /analysis/ returns 202 with a resultId and a retrieveAt timestamp,
      and results are collected on a follow-up call. Documented in prose only —
      no OpenAPI is published for this API. Not included in standard contracts;
      sold on a cost-per-query model where one query is one keyword or boolean
      over one 24-hour period.
  - aid: brandwatch:data-upload-api
    name: Brandwatch Data Upload API
    tags:
      - Data Import
      - Custom Data
      - Analytics
    humanURL: https://developers.brandwatch.com/docs/getting-started-data-upload
    baseURL: https://api.brandwatch.com
    properties:
      - url: https://developers.brandwatch.com/docs/getting-started-data-upload
        type: Documentation
      - url: https://developers.brandwatch.com/docs/getting-started-data-upload
        type: GettingStarted
      - url: https://developers.brandwatch.com/docs/uploading-documents
        type: APIReference
    description: >-
      Import unstructured data from any source for analysis alongside consumer
      conversation data. Enables organizations to blend proprietary data with
      Brandwatch's social intelligence for unified analytics. Custom data
      sources are created at POST /content/sources and documents uploaded at
      POST /content/upload. Documented in prose only — no OpenAPI is published
      for this API. Access is off by default and must be enabled per-account by
      a Brandwatch Customer Success Manager.
  - aid: brandwatch:consumer-research-api
    name: Brandwatch Consumer Research API
    tags:
      - Consumer Research
      - Data Export
      - Real-time Streaming
    humanURL: https://developers.brandwatch.com/
    baseURL: https://api.brandwatch.com
    properties:
      - url: https://developers.brandwatch.com/
        type: Documentation
      - url: https://developers.brandwatch.com/
        type: DeveloperPortal
      - url: https://developers.brandwatch.com/docs/data-retrieval
        type: APIReference
      - url: https://developers.brandwatch.com/docs/getting-started
        type: GettingStarted
      - url: https://developers.brandwatch.com/docs/authenticate
        type: Authentication
      - url: https://developers.brandwatch.com/changelog
        type: ChangeLog
      - url: https://developers.brandwatch.com/docs/rate-limiting
        type: RateLimits
      - url: openapi/brandwatch-consumer-research-openapi.yml
        type: OpenAPI
      - url: openapi/brandwatch-consumer-research-authentication-openapi.yml
        type: OpenAPI
      - url: overlays/brandwatch-consumer-research-overlay.yaml
        type: Overlay
      - url: data-model/brandwatch-data-model.yml
        type: DataModel
      - url: errors/brandwatch-problem-types.yml
        type: ErrorCatalog
      - url: mcp/brandwatch-mcp.yml
        type: MCPServer
    description: >-
      Export analysis results for further research and integration with existing
      systems. Supports real-time data streaming alongside consumer conversation
      data for continuous monitoring and research workflows. The only Brandwatch
      API with a machine-readable contract: two OpenAPI 3.1.0 documents covering
      36 operations across projects, queries, query groups, tags, categories,
      rules, author/location/site lists, workflow, mentions, topics and charts.
      Discoverable through an RFC 9727 API catalog at
      developers.brandwatch.com/.well-known/api-catalog. Rate limited to 30
      requests per rolling 10 minutes at the account (Client) level.
  - aid: brandwatch:measure-api
    name: Brandwatch Measure API
    tags:
      - Social Metrics
      - Owned Social
      - Reporting
    humanURL: https://www.brandwatch.com/products/apis/
    properties:
      - url: https://www.brandwatch.com/products/apis/
        type: Documentation
    description: >-
      Integrate owned social media metrics into external analytics solutions for
      custom reporting. Enables organizations to combine their social channel
      performance data with Brandwatch's audience intelligence in third-party BI
      and reporting platforms. Part of the Social Media Management (formerly
      Falcon) suite. Marketed on brandwatch.com/products/apis/ but absent from
      developers.brandwatch.com — no reference, no base URL, no authentication
      guide and no machine-readable contract is published, so no baseURL is
      recorded here rather than guessing one.
  - aid: brandwatch:publish-api
    name: Brandwatch Publish API
    tags:
      - Publishing
      - Content Management
      - Social Media
    humanURL: https://www.brandwatch.com/products/apis/
    properties:
      - url: https://www.brandwatch.com/products/apis/
        type: Documentation
    description: >-
      Export social publishing data to integrate with content management systems.
      Enables workflow automation between Brandwatch's publishing tools and
      external CMS platforms for unified content operations. Part of the Social
      Media Management (formerly Falcon) suite. Marketed on
      brandwatch.com/products/apis/ but absent from developers.brandwatch.com —
      no reference, no base URL and no machine-readable contract is published,
      so no baseURL is recorded here rather than guessing one.
  - aid: brandwatch:engage-api
    name: Brandwatch Engage API
    tags:
      - Social Engagement
      - Customer Service
      - Inbox Management
    humanURL: https://www.brandwatch.com/products/apis/
    properties:
      - url: https://www.brandwatch.com/products/apis/
        type: Documentation
    description: >-
      Consolidate conversations from social media inboxes with customer inquiries
      across platforms. Enables integration of Brandwatch's engagement tools with
      CRM and customer service systems for unified conversation management. Part
      of the Social Media Management (formerly Falcon) suite. Marketed on
      brandwatch.com/products/apis/ but absent from developers.brandwatch.com —
      no reference, no base URL and no machine-readable contract is published,
      so no baseURL is recorded here rather than guessing one.
