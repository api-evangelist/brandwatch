      use: supplementary
  sub_processors: https://www.brandwatch.com/legal/sub-processors/
  sub_processor_subscriptions: https://www.brandwatch.com/legal/sub-processors/#subscribe-to-sub-processor-changes
  encryption_in_transit: TLS 1.2 and 1.3, TLS 1.2 by default
  encryption_at_rest: SSE-S3 for uploaded data and backups; AES-256 for physical backup tapes
  data_retention_after_termination: 30 days maximum, then automated deletion or anonymization
  sso:
