      region: Europe
    - provider: Virtus DC (Hayes, UK)
      use: analysis results and customer metadata, colocation
      region: UK
    - provider: AWS and GCP
      use: Social Media Management products
      region: EU (Listening infrastructure in US and UK, public data only)
    - provider: Heroku and AWS
      use: Influence (formerly Paladin)
      region: US
