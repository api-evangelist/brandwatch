url: https://www.brandwatch.com/legal/information-security/
title: The Brandwatch Security Programme
format: single long-form page
format_note: >-
  Not a hosted trust portal — trust.brandwatch.com does not resolve (DNS
  NXDOMAIN) and there is no Vanta/Drata/SafeBase surface. What Brandwatch
  publishes is one twelve-section security programme page under /legal/. It is
  unusually detailed for a page of that kind: named hosting providers, named
  data-centre locations, retention windows, password policy and encryption
  specifics are all stated in the open.
certifications:
  - name: ISO/IEC 27001:2022
    scope: all Brandwatch products
    status: certified
    audit_cadence: at least annually, third party
    certificate_availability: on request via a Brandwatch contact
    evidence: >-
      "All Brandwatch products are ISO 27001:2022 certified ... We engage a
      third party to audit our adherence to these standards at least annually.
      Our current ISO 27001 certificate is available upon request."
