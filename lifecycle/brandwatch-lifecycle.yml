  scheme: none
  current: '2.0'
  in_path: false
  in_header: false
  in_media_type: false
  docs: null
  note: >-
    Both OpenAPI documents declare info.version "2.0", but the version is not
    expressed anywhere a client can act on it — every published URL is
    https://api.brandwatch.com/<resource> with no version segment, no
    Accept-Version header and no versioned media type. A consumer cannot pin a
    version and cannot detect that the version changed.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No deprecation policy page, no notice period, no Sunset or Deprecation
    header support, and zero operations flagged `deprecated: true` in either
    spec. What Brandwatch publishes instead is a support-boundary statement —
    "we only officially support the API endpoints featured here, in our
    documentation. Any other endpoints are subject to change without notice."
    That is the inverse of a deprecation policy: it disclaims notice rather than
    promising it. No Deprecation pointer is emitted for this provider.
breaking_change_precedent:
  events:
    - date: '2025-12-18'
      change: Reddit data restrictions
      detail: >-
        Restrictions on Reddit Mention metadata retrievable through the Consumer
        Research API, introduced January 2026 and announced via the changelog.
      kind: upstream-platform-driven field removal
      source: https://developers.brandwatch.com/changelog/reddit-data-restrictions.md
    - date: null
      change: X (formerly Twitter) metadata stripping
      detail: >-
        X posts returned by the API have full text and most metadata stripped
        for compliance reasons, causing documented discrepancies between what
        the Consumer Research UI shows and what the API returns. Brandwatch's
        advice is to take the `guid` and go get the body from X directly.
      kind: upstream-platform-driven field removal
      source: https://developers.brandwatch.com/docs/data-restrictions
  note: >-
    Brandwatch's real breaking-change vector is not its own versioning — it is
    the social platforms upstream. Data availability changes per account
    depending on which Data Packs are bought, which means two customers calling
    the identical operation can get different field sets with no contract
    difference between them.
