summary:
  conforms: 11
  partial: 3
  claimed: 1
  does_not_conform: 8
  strengths:
    - RFC 9727 API catalog (rare, and the only reason the spec was findable)
    - a correct, current llms.txt
    - ISO/IEC 27001:2022 across all products
    - consistent offset pagination
    - a conformant OIDC/Keycloak deployment behind the human sign-in
  gaps:
    - no security.txt despite having a policy and a contact
    - no RFC 9457 errors
    - no idempotency on any write
    - non-standard rate-limit headers with no Retry-After
    - empty components.schemas
  headline: >-
    Brandwatch is not short of standards capability — it runs conformant OIDC
    with PKCE, dynamic client registration and product-scoped claims for its
    human sign-in, and it publishes an RFC 9727 API catalog that most of the
    catalog does not. None of that reaches the API, which authenticates with a
    vendor grant, returns OAuth-shaped errors instead of RFC 9457, signals rate
    limits with x- headers, and offers no idempotency. The gap here is a wiring
    problem, not a capability problem.
