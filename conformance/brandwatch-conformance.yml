  - id: iso-8601
    conforms: true
    evidence: startDate/endDate/sinceDate parameters and Analysis API timestamps use ISO 8601 with UTC offsets
  - id: tls-1.2-minimum
    conforms: true
    evidence: >-
      "all requests to our servers must be done over HTTPS and TLS 1.2 or newer.
