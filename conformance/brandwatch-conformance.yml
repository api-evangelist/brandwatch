standards:
  - id: openapi-3.1
    conforms: true
    evidence: >-
      Both published documents declare openapi 3.1.0 and parse. Served as
      application/vnd.oai.openapi+json from the provider's own API catalog.
  - id: rfc9727-api-catalog
    conforms: true
    evidence: >-
      https://developers.brandwatch.com/.well-known/api-catalog returns 200
      application/linkset+json with service-desc and service-doc entries for
      both OpenAPI documents. Genuinely uncommon — most providers in the catalog
      serve nothing at this path.
  - id: oauth2
    conforms: partial
    evidence: >-
      Token endpoint at https://api.brandwatch.com/oauth/token returning
      access_token / token_type / expires_in / scope, which is the RFC 6749
      token response. But the grant is a vendor extension
      (grant_type=api-password) rather than any registered OAuth 2.0 grant, the
      spec's declared clientCredentials flow points at a
      https://example.com/oauth2/token placeholder, there is no authorization
      endpoint, no refresh token, no revocation endpoint and no scope selection.
      Shaped like OAuth, not an OAuth deployment.
  - id: oidc
    conforms: partial
    evidence: >-
      A full OpenID Connect Discovery 1.0 document IS served, at
      https://signin.brandwatch.com/auth/realms/bwone/.well-known/openid-configuration
      — a Keycloak realm backing Brandwatch One human sign-in, supporting PKCE
      (S256), authorization_code, refresh_token, client_credentials, CIBA,
      device code, introspection and dynamic client registration, with 18 scopes
      including product-scoped ci / smm / bwone-organization-id claims. But it
      does not serve the API: Consumer Research API callers authenticate against
      api.brandwatch.com/oauth/token with a vendor grant. Brandwatch runs
      conformant OIDC for humans and a non-standard grant for machines.
  - id: pkce
    conforms: true
    scope: platform SSO only
    evidence: code_challenge_methods_supported includes S256 on the bwone realm
  - id: oauth2-dynamic-client-registration
    conforms: true
    scope: platform SSO only
    evidence: registration_endpoint present on the bwone realm discovery document
  - id: rfc9116-security-txt
    conforms: false
    evidence: >-
      404 on every host, despite Brandwatch publishing both a disclosure policy
      and a security@brandwatch.com contact in prose. See
      security/brandwatch-vulnerability-disclosure.yml.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors use the OAuth-style {"error","error_description"} envelope with
      media type application/json. No application/problem+json anywhere.
  - id: rfc6585-429
    conforms: true
    evidence: >-
      429 Too Many Requests on rate-limit exhaustion, documented at
      https://developers.brandwatch.com/docs/rate-limiting — though it is not
      declared on any operation in the spec.
  - id: ratelimit-header-fields-draft
    conforms: false
    evidence: >-
      Uses vendor headers x-rate-limit and x-rate-limit-used rather than the
      RateLimit / RateLimit-Policy draft fields. No Retry-After.
  - id: rfc8594-sunset-header
    conforms: false
    evidence: no Sunset or Deprecation header support and no deprecation policy
  - id: idempotency-key
    conforms: false
    evidence: no idempotency key parameter, header or documentation on any of the 13 write operations
  - id: pagination
    conforms: true
    evidence: >-
      Consistent offset pagination — page / pageSize in, resultsTotal /
      resultsPage / resultsPageSize / results out, across 8 operations.
  - id: json-schema-2020-12
    conforms: partial
    evidence: >-
      Inline schemas throughout under OpenAPI 3.1 (which uses JSON Schema
