                          example: false
                          default: true
                        lockedByUsername: {}
                        createdByWizard:
                          type: boolean
                          example: false
                          default: true
                        languages:
                          type: array
                          items:
                            type: string
                            example: en
                        contentSources:
                          type: array
                          items:
                            type: string
                            example: news
                        languageAgnostic:
