                    : -1,\n    \"results\": [\n        {\n            \"id\": 1999933037,\n          \
                    \  \"name\": \"@brandwatchsocial\",\n            \"type\": \"monitor\",\n        \
                    \    \"creationDate\": \"2019-10-10T17:36:13.933+0000\",\n            \"lastModificationDate\"\
