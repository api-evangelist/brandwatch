openapi: 3.1.0
info:
  title: Consumer Research API
  version: '2.0'
servers:
- url: https://api.brandwatch.com
components:
  securitySchemes:
    sec0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.com/oauth2/token
          scopes: {}
security:
- sec0: []
paths:
  /me:
    get:
      summary: The Me Call
      description: 'Return a combination of User and Client information in one call.


        There is a handy combined API call to find out a combination of User and Client information in
        one go:'
      operationId: the-me-call-1
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"id\": 328973287,\n    \"username\": \"example@example.com\",\n    \"\
                    uiRole\": \"user\",\n    \"firstName\": \"Wile E.\",\n    \"tags\": {\n        \"\
                    notify\": \"true\"\n    },\n    \"client\": {\n        \"id\": 3328928272,\n     \
                    \   \"name\": \"ACME Robotics\",\n        \"theme\": \"brandwatch\",\n        \"parentId\"\
                    : -1,\n        \"userInactivityTimeoutMinutes\": 1440,\n        \"priceStructureName\"\
                    : \"Legacy\",\n        \"queryLimit\": 20000,\n        \"mentionLimit\": -1,\n   \
                    \     \"priceStructureLineCost\": 0,\n        \"startDate\": \"0024-07-30T00:00:00.000+0000\"\
                    \n    },\n    \"crmAccount\": null,\n    \"passwordExpiryDate\": null,\n    \"creationDate\"\
                    : \"2016-06-29T16:19:17.744+0000\",\n    \"lastName\": \"Coyote\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 328973287
                    default: 0
                  username:
                    type: string
                    example: example@example.com
                  uiRole:
                    type: string
                    example: user
                  firstName:
                    type: string
                    example: Wile E.
                  tags:
                    type: object
                    properties:
                      notify:
                        type: string
                        example: 'true'
                  client:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 3328928272
                        default: 0
                      name:
                        type: string
                        example: ACME Robotics
                      theme:
                        type: string
                        example: brandwatch
                      parentId:
                        type: integer
                        example: -1
                        default: 0
                      userInactivityTimeoutMinutes:
                        type: integer
                        example: 1440
                        default: 0
                      priceStructureName:
                        type: string
                        example: Legacy
                      queryLimit:
                        type: integer
                        example: 20000
                        default: 0
                      mentionLimit:
                        type: integer
                        example: -1
                        default: 0
                      priceStructureLineCost:
                        type: integer
                        example: 0
                        default: 0
                      startDate:
                        type: string
                        example: 0024-07-30T00:00:00.000+0000
                  crmAccount: {}
                  passwordExpiryDate: {}
                  creationDate:
                    type: string
                    example: 2016-06-29T16:19:17.744+0000
                  lastName:
                    type: string
                    example: Coyote
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"error\": \"unauthorized\",\n    \"error_description\": \"Invalid authentication\
                    \ credentials found on request\"\n}"
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: unauthorized
                  error_description:
                    type: string
                    example: Invalid authentication credentials found on request
        '403':
          description: '403'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
        '404':
          description: '404'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X GET https://api.brandwatch.com/me
        samples-languages:
        - curl
  /projects/summary:
    get:
      summary: Project Summary List
      description: Retrieve a summary of all of your Projects.
      operationId: retrieving-project-summary
      parameters:
      - name: page
        in: query
        description: page
        schema:
          type: integer
          format: int32
          default: -1
      - name: pageSize
        in: query
        description: Total results shown per page
        schema:
          type: integer
          format: int32
          default: -1
      - name: nameContains
        in: query
        description: Search for projects which contain a specified string in their name
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"resultsTotal\": 2,\n  \"resultsPage\": -1,\n  \"resultsPageSize\": -1,\n\
                    \  \"results\": [\n    {\n      \"id\": 398748937,\n      \"name\": \"Telecoms research\"\
                    ,\n      \"description\": \"Mobile phones\",\n      \"billableClientId\": 127732,\n\
                    \      \"billableClientName\": \"My company\",\n      \"timezone\": \"Africa/Abidjan\"\
                    ,\n      \"billableClientIsPitch\": false\n    },\n    {\n      \"id\": 32092327,\n\
                    \      \"name\": \"GPS research\",\n      \"description\": \"In-car navigation systems\"\
                    ,\n      \"billableClientId\": 127732,\n      \"billableClientName\": \"My company\"\
                    ,\n      \"timezone\": \"America/Glace_Bay\",\n      \"billableClientIsPitch\": false\n\
                    \    }\n  ]\n}"
              schema:
                type: object
                properties:
                  resultsTotal:
                    type: integer
                    example: 2
                    default: 0
                  resultsPage:
                    type: integer
                    example: -1
                    default: 0
                  resultsPageSize:
                    type: integer
                    example: -1
                    default: 0
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 398748937
                          default: 0
                        name:
                          type: string
                          example: Telecoms research
                        description:
                          type: string
                          example: Mobile phones
                        billableClientId:
                          type: integer
                          example: 127732
                          default: 0
                        billableClientName:
                          type: string
                          example: My company
                        timezone:
                          type: string
                          example: Africa/Abidjan
                        billableClientIsPitch:
                          type: boolean
                          example: false
                          default: true
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '403':
          description: '403'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
        '404':
          description: '404'
          content:
            text/plain:
              examples:
                Result:
                  value: ''
      deprecated: false
      x-readme:
        code-samples:
        - language: curl
          code: curl -X GET https://api.brandwatch.com/projects/summary
        samples-languages:
        - curl
