candidate_server:
  name: brandwatch
  transport: http
  base: https://api.brandwatch.com
  auth: >-
    bearer token from POST /oauth/token with grant_type=api-password — a server
    would have to hold a long-lived (one-year) account-scoped credential, since
    Brandwatch offers no scoped or short-lived token.
  design_constraint: >-
    The binding constraint on any Brandwatch MCP server is the rate limit: 30
    calls per 10 minutes at the CLIENT level, shared across every integration
    and user on the account. An agent that lists projects, lists queries, then
    pages mentions can exhaust a whole organization's budget in under a minute.
    A serious server would need aggressive caching of the reference entities
    (projects, queries, tags, categories, lists) exactly as the provider's
    best-practices page recommends for human-written clients.
