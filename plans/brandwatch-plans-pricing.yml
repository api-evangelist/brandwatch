specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Brandwatch
providerId: brandwatch
created: '2026-05-04'
modified: '2026-08-13'
generated: '2026-08-13'
method: searched
source: https://www.brandwatch.com/plans/
docs:
  - https://www.brandwatch.com/plans/
  - https://developers.brandwatch.com/docs/getting-started-analysis-api
  - https://developers.brandwatch.com/docs/getting-started-data-upload
tags:
  - Analytics
  - Social Media
  - Consumer Intelligence
  - Pricing
description: >-
  Brandwatch publishes no prices. This artifact replaces a 2026-05-04 scaffold
  that invented a Free / Professional / Enterprise ladder with 1,000 and 100,000
  request quotas — none of which Brandwatch has ever published. The real
  /plans/ page is a solution chooser (Consumer Intelligence, Social Media
  Management, Influencer Marketing) where every call to action is "See it in
  action" or "Schedule your free demo". There is no price, no tier table, no
  API request quota, no free tier and no self-service sign-up anywhere on the
  Brandwatch site.
plan_count: 0
pricing_model: contact-sales
self_service_signup: false
free_tier: false
trial: demo-request-only
plans: []
api_commercial_terms:
  - api: Brandwatch Consumer Research API
    included: >-
      Available to existing Consumer Research customers whose users hold the
      "Regular" or "Admin" role. No separate API price is published.
    source: https://developers.brandwatch.com/docs/authenticate
  - api: Brandwatch Data Upload API
    included: >-
      Off by default. "In order to get access to the Data Upload API, please
      contact your CSM to have access enabled."
    source: https://developers.brandwatch.com/docs/getting-started-data-upload
  - api: Brandwatch Analysis API
    included: false
    model: cost-per-query, sold in packages
    detail: >-
      "The Analysis API is not included in standard contracts, instead relying
      on a cost-per-query model." A query is one keyword or boolean over one
      24-hour period, so a week of one keyword is seven billable queries.
      Queries that error or that never produce a retrievable result are not
      counted; queries that return zero matches ARE counted. Quota balance is
      readable at GET /analysis/usage (total / totalActive / remaining) but the
      package prices are not published.
    source: https://developers.brandwatch.com/docs/analysis-request
  - api: Brandwatch Measure API
    included: unknown
    note: no public developer documentation
  - api: Brandwatch Publish API
    included: unknown
    note: no public developer documentation
  - api: Brandwatch Engage API
    included: unknown
    note: no public developer documentation
evidence:
