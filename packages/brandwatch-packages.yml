source: >-
  PyPI + npm registry metadata endpoints, the BrandwatchLtd GitHub organization
  (https://github.com/BrandwatchLtd), and the Brandwatch developer docs
  "Best practices & our terms" page which names the Python utility library.
note: >-
  Brandwatch ships client libraries but has stopped maintaining them. Every
  first-party package below was last published between 2018 and 2022 — the most
  recent, bcr-api 1.5.1, is four years old, while the Consumer Research API it
  wraps shipped documented changes as recently as 2026-03-24
  (see changelog/brandwatch-changelog.yml). There is no first-party SDK for any
  language other than Python and JavaScript, and no SDK at all for the Analysis
  API or the Data Upload API.
